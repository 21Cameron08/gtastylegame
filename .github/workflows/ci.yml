name: Build, test, deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      # Pinned to Ubuntu 24.04's Blender 4.0.2, the same version the cloud dev environment uses.
      - name: Install Blender
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends blender python3-numpy
          blender -b --version | head -1

      - run: npm ci

      - name: Build assets (Blender generators, validation, compression)
        run: npm run assets

      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests (WebGPU and WebGL 2)
        run: npm run e2e
        env:
          REQUIRE_WEBGPU: '1'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: game/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
